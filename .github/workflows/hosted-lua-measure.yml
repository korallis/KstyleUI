name: hosted Lua measurement

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [.github/workflows/hosted-lua-measure.yml]

permissions:
  contents: read

jobs:
  measure:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install the same PUC Lua 5.1.5
        run: |
          bash Tools/dev/install-lua51.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Record the machine and tree
        run: |
          git rev-parse HEAD 'HEAD^{tree}'
          uname -a
          uptime
          python3 -c 'import os, platform; print(platform.platform(), platform.machine(), "CPUs:", os.cpu_count())'
          lua5.1 -v
      - name: Measure every file with the unchanged budgets
        run: bash Tools/regression/run-all.sh | tee "$RUNNER_TEMP/hosted-lua.log"
      - name: Keep the complete CPU measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-${{ matrix.runner }}
          path: ${{ runner.temp }}/hosted-lua.log
          if-no-files-found: error
          retention-days: 7
