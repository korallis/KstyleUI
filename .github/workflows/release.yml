# release.yml: on a v* tag on main, package with the BigWigs packager and upload to CurseForge, Wago and GitHub,
# then build the loose-file icon pack (Tools/icons/iconset.py pack, docs/icons.md) and upload it beside the addon zip.
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mac-ci, KstyleUI]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The packager reads the history for the version and the changelog, and the tag check reads main.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tag $GITHUB_REF_NAME is not on main. Release only from main, after the in-game pass on staging."
            exit 1
          fi
      - name: Check the runner's Lua is 5.1.5 and its Python has Pillow
        run: |
          lua5.1 -v 2>&1 | grep '^Lua 5\.1\.5 '
          "$KSTYLEUI_PILLOW_PYTHON" -c 'import PIL; print("Pillow", PIL.__version__)'
      - name: Lua regression tests
        run: bash Tools/regression/run-all.sh
      - name: Build the icon pack without uploading
        run: |
          "$KSTYLEUI_PILLOW_PYTHON" Tools/icons/iconset.py verify
          "$KSTYLEUI_PILLOW_PYTHON" Tools/icons/iconset.py pack --out "$RUNNER_TEMP/icons"
          test -n "$(find "$RUNNER_TEMP/icons/Interface/Icons" -name '*.tga' -print -quit)"
      - name: Package without uploading
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d
          pandoc: false
      - name: Check the zip
        run: bash Tools/hooks/check-package.sh

  release:
    name: release
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mac-ci, KstyleUI]
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Package and upload
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          pandoc: false
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the runner's Python has Pillow
        run: |
          "$KSTYLEUI_PILLOW_PYTHON" -c 'import PIL; print("Pillow", PIL.__version__)'
      - name: Build the icon pack and upload it to the GitHub release
        # The pack is a separate download: CurseForge and Wago install only into AddOns, and the pack goes
        # into _forever_/Interface/Icons (docs/icons.md). The packager made the release above; this adds the zip.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$KSTYLEUI_PILLOW_PYTHON" Tools/icons/iconset.py pack --out "$RUNNER_TEMP/icons"
          (cd "$RUNNER_TEMP/icons" && zip -r -q "$RUNNER_TEMP/KstyleUI-Icons-${GITHUB_REF_NAME#v}.zip" Interface)
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/KstyleUI-Icons-${GITHUB_REF_NAME#v}.zip" --clobber
