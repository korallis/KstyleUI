# release.yml: on a v* tag on main, package with the BigWigs packager and upload to CurseForge, Wago and GitHub,
# then build the loose-file icon pack (Tools/icons/iconset.py pack, docs/icons.md) and upload it beside the addon zip.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to announce (leave empty for the roadmap)
        type: string
      message_ids:
        description: Optional comma-separated message IDs (edit first, delete the rest; one ID for the roadmap)
        type: string
      roadmap:
        description: Post docs/ROADMAP.md instead of a release
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.proof.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The packager reads the history for the version and the changelog, and the tag check reads main.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tag $GITHUB_REF_NAME is not on main. Release only from main, after the in-game pass on staging."
            exit 1
          fi
      - name: Reuse successful checks or refuse known-red proof
        # Tags from hotfix/vX.Y.Z normally have no push proof, so release runs its own lint, Python and Lua checks.
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m Tools.release.proof
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install the hosted runner tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          python3 -m pip install Pillow==13.0.0
          echo "KSTYLEUI_PILLOW_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
      - name: Install the lint and Python check tools
        if: steps.proof.outputs.run != 'false'
        run: |
          sudo apt-get install -y luajit luarocks
          luarocks --local --lua-version=5.1 install luacheck 1.2.0
          python3 -m venv "$HOME/.local/share/wow-dev/venv"
          "$HOME/.local/share/wow-dev/venv/bin/python" -m pip install pre-commit==4.7.0
          echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/wow-dev/venv/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=$(luarocks --local --lua-version=5.1 path --lr-path)" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$(luarocks --local --lua-version=5.1 path --lr-cpath)" >> "$GITHUB_ENV"
      - name: Run missing lint checks
        if: steps.proof.outputs.run != 'false'
        run: bash scripts/gate.sh lint
      - name: Run missing Python checks
        if: steps.proof.outputs.run != 'false'
        run: bash scripts/gate.sh python
      - name: Check the release changelog
        run: python3 -m unittest Tools.tests.test_release_changelog
      - name: Check the runner's Lua is 5.1.5 and its Python has Pillow
        run: |
          lua5.1 -v 2>&1 | grep '^Lua 5\.1\.5 '
          "$KSTYLEUI_PILLOW_PYTHON" -c 'import PIL; print("Pillow", PIL.__version__)' | grep '^Pillow 13\.0\.0$'
      - name: Build the icon pack without uploading
        run: |
          "$KSTYLEUI_PILLOW_PYTHON" Tools/icons/iconset.py verify
          "$KSTYLEUI_PILLOW_PYTHON" Tools/icons/iconset.py pack --out "$RUNNER_TEMP/icons"
          test -n "$(find "$RUNNER_TEMP/icons/Interface/Icons" -name '*.tga' -print -quit)"
      - name: Package without uploading
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d
          pandoc: false
      - name: Check the zip
        run: bash Tools/hooks/check-package.sh

  lua:
    name: lua ${{ matrix.shard }}/8
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install hosted Lua 5.1
        if: needs.check.outputs.run != 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Check the runner's Lua is 5.1.5
        if: needs.check.outputs.run != 'false'
        run: lua5.1 -v 2>&1 | grep '^Lua 5\.1\.5 '
      - name: Lua regression tests, one slice of the files
        if: needs.check.outputs.run != 'false'
        env:
          SHARD: ${{ matrix.shard }}
        run: bash scripts/gate.sh lua --shard "$SHARD/8"

  release:
    name: release
    needs: [check, lua]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Pillow and build the icon pack before anything is published
        run: |
          python3 -m pip install Pillow==13.0.0
          python3 -c 'import PIL; print("Pillow", PIL.__version__)' | grep '^Pillow 13\.0\.0$'
          python3 Tools/icons/iconset.py pack --out "$RUNNER_TEMP/icons"
          (cd "$RUNNER_TEMP/icons" && zip -r -q "$RUNNER_TEMP/KstyleUI-Icons-${GITHUB_REF_NAME#v}.zip" Interface)
      - name: Package and upload
        # The check job validates a deterministic dry build of this same commit with this same pinned packager.
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          pandoc: false
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the icon pack to the GitHub release
        # The pack is a separate download: CurseForge and Wago install only into AddOns, and the pack goes
        # into _forever_/Interface/Icons (docs/icons.md). The packager made the release above; this adds the zip.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/KstyleUI-Icons-${GITHUB_REF_NAME#v}.zip" --clobber
      - name: Show only this version's changelog on the GitHub release
        # The packager writes the whole CHANGELOG.md to the release page.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 Tools/release/discord_post.py --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Post the changelog to Discord
        continue-on-error: true
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: python3 Tools/release/discord_post.py "$GITHUB_REF_NAME"

  discord-repost:
    name: Repost Discord announcement
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Post or edit the Discord announcement
        env:
          TAG: ${{ inputs.tag }}
          MESSAGE_IDS: ${{ inputs.message_ids }}
          ROADMAP: ${{ inputs.roadmap }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if [ "$ROADMAP" = true ]; then
            set -- --roadmap ${MESSAGE_IDS:+--edit}
          else
            git show-ref --verify "refs/tags/$TAG"
            set -- ${MESSAGE_IDS:+--edit} "$TAG"
          fi
          if [ -n "$MESSAGE_IDS" ]; then set -- "$@" "$MESSAGE_IDS"; fi
          python3 Tools/release/discord_post.py "$@"
