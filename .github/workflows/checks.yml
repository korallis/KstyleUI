name: checks
run-name: "${{ github.event_name == 'push' && format('staging: {0}', github.event.head_commit.message) || github.event.pull_request.title || 'checks (manual run)' }}"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lua:
    name: lua ${{ matrix.shard }}/${{ strategy.job-total }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "mac-ci", "KstyleUI"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1, 2, 3, 4, 5, 6]' || '[1, 2]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Decide whether the Lua suite has work
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 Tools/hooks/ci_scope.py lua
      - name: Identify the PR tree
        id: tree
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo checked > "$RUNNER_TEMP/ci-result"
      - name: Record the lua start
        id: start_lua
        if: ${{ always() && github.event_name == 'pull_request' && steps.scope.outputs.run != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-${{ steps.tree.outputs.tree }}-lua-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'pull_request' && steps.scope.outputs.run != 'false' && steps.start_lua.outcome == 'success'
        with:
          path: ~/.cache/lua51/*.deb
          key: ${{ runner.os }}-${{ runner.arch }}-lua515
      - name: Install hosted Lua 5.1
        if: github.event_name == 'pull_request' && steps.scope.outputs.run != 'false' && steps.start_lua.outcome == 'success'
        run: |
          mkdir -p "$HOME/.cache/lua51/partial"
          sudo apt-get update -qq
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/lua51" install -y lua5.1
      - name: Check the runner's Lua is 5.1.5
        if: steps.scope.outputs.run != 'false' && (github.event_name != 'pull_request' || steps.start_lua.outcome == 'success')
        run: lua5.1 -v 2>&1 | grep '^Lua 5\.1\.5 '
      - name: Lua regression tests, one slice of the files
        if: steps.scope.outputs.run != 'false' && (github.event_name != 'pull_request' || steps.start_lua.outcome == 'success')
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: bash scripts/gate.sh lua --shard "$SHARD/$SHARD_TOTAL"
      - name: Record the Lua shard result
        if: ${{ always() && github.event_name == 'pull_request' && steps.scope.outputs.run != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ job.status == 'success' && 'green' || 'red' }}-${{ steps.tree.outputs.tree }}-lua-${{ matrix.shard }}-of-${{ strategy.job-total }}
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Report a failed staging push
        if: (failure() || cancelled()) && github.event_name == 'push'
        run: 'echo "::error title=staging is red::The merged result of staging fails: lua. Open the failed step above for the test."'

  python-package:
    name: lint, python and package
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      KSTYLEUI_PYTHON: /home/runner/.local/share/wow-dev/venv/bin/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide which suites have work
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 Tools/hooks/ci_scope.py all
      - name: Identify the PR tree
        id: tree
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo checked > "$RUNNER_TEMP/ci-result"
      - name: Record the lint start
        id: start_lint
        if: ${{ always() && github.event_name == 'pull_request' && steps.scope.outputs.lint != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-${{ steps.tree.outputs.tree }}-lint
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        if: steps.scope.outputs.lint != 'false' || steps.scope.outputs.python != 'false' || steps.scope.outputs.package != 'false'
        with:
          python-version: '3.12'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.scope.outputs.lint != 'false' || steps.scope.outputs.python != 'false' || steps.scope.outputs.package != 'false'
        id: tools
        with:
          path: |
            ~/.luarocks
            ~/.local/share/wow-dev/venv
            ~/.cache/pre-commit
          key: ${{ runner.os }}-${{ runner.arch }}-python${{ steps.python.outputs.python-version }}-precommit470-luacheck120-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Install the hosted runner tools
        if: steps.scope.outputs.lint != 'false' || steps.scope.outputs.python != 'false' || steps.scope.outputs.package != 'false'
        env:
          CACHE_HIT: ${{ steps.tools.outputs.cache-hit }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 luajit luarocks
          if [ "$CACHE_HIT" != true ]; then
            luarocks --local --lua-version=5.1 install luacheck 1.2.0
            python3 -m venv "$HOME/.local/share/wow-dev/venv"
            "$KSTYLEUI_PYTHON" -m pip install pre-commit==4.7.0
          fi
          echo "$HOME/.luarocks/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/wow-dev/venv/bin" >> "$GITHUB_PATH"
          echo "LUA_PATH=$(luarocks --local --lua-version=5.1 path --lr-path)" >> "$GITHUB_ENV"
          echo "LUA_CPATH=$(luarocks --local --lua-version=5.1 path --lr-cpath)" >> "$GITHUB_ENV"
      - name: Check the runner's luacheck and pre-commit
        if: steps.scope.outputs.lint != 'false' && (github.event_name != 'pull_request' || steps.start_lint.outcome == 'success')
        run: |
          luacheck --version | grep '^Luacheck: 1\.2\.0$'
          pre-commit --version | grep '^pre-commit 4\.7\.0$'
      - name: Run the lint gate (crlf, pre-commit, luacheck, check_toc, strings, suppressions)
        if: steps.scope.outputs.lint != 'false' && (github.event_name != 'pull_request' || steps.start_lint.outcome == 'success')
        env:
          GATE_BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: bash scripts/gate.sh lint
      - name: Record the lint result
        if: ${{ always() && github.event_name == 'pull_request' && steps.scope.outputs.lint != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ job.status == 'success' && 'green' || 'red' }}-${{ steps.tree.outputs.tree }}-lint
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Record the python start
        id: start_python
        if: ${{ always() && github.event_name == 'pull_request' && steps.scope.outputs.python != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-${{ steps.tree.outputs.tree }}-python
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Record the package start
        id: start_package
        if: ${{ always() && github.event_name == 'pull_request' && steps.scope.outputs.package != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-${{ steps.tree.outputs.tree }}-package
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Check the runner's Lua is 5.1.5
        if: ${{ !cancelled() && ((steps.scope.outputs.python != 'false' && (github.event_name != 'pull_request' || steps.start_python.outcome == 'success')) || (steps.scope.outputs.package != 'false' && (github.event_name != 'pull_request' || steps.start_package.outcome == 'success'))) }}
        run: lua5.1 -v 2>&1 | grep '^Lua 5\.1\.5 '
      - name: Check the runner's Python is 3.12
        if: ${{ !cancelled() && steps.scope.outputs.python != 'false' && (github.event_name != 'pull_request' || steps.start_python.outcome == 'success') }}
        run: python3 --version | grep '^Python 3\.12\.'
      - name: Python tool tests
        if: ${{ !cancelled() && steps.scope.outputs.python != 'false' && (github.event_name != 'pull_request' || steps.start_python.outcome == 'success') }}
        run: bash scripts/gate.sh python
      - name: Record the Python result
        if: ${{ always() && github.event_name == 'pull_request' && steps.scope.outputs.python != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ job.status == 'success' && 'green' || 'red' }}-${{ steps.tree.outputs.tree }}-python
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Remove tags from the check build
        if: ${{ !cancelled() && steps.scope.outputs.package != 'false' && (github.event_name != 'pull_request' || steps.start_package.outcome == 'success') }}
        run: git for-each-ref --format='delete %(refname)' refs/tags | git update-ref --stdin
      - name: Package without uploading or localisation
        if: ${{ !cancelled() && steps.scope.outputs.package != 'false' && (github.event_name != 'pull_request' || steps.start_package.outcome == 'success') }}
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -l
          pandoc: false
      - name: Check the zip
        if: ${{ !cancelled() && steps.scope.outputs.package != 'false' && (github.event_name != 'pull_request' || steps.start_package.outcome == 'success') }}
        run: bash Tools/hooks/check-package.sh
      - name: Record the package result
        if: ${{ always() && github.event_name == 'pull_request' && steps.scope.outputs.package != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ job.status == 'success' && 'green' || 'red' }}-${{ steps.tree.outputs.tree }}-package
          path: ${{ runner.temp }}/ci-result
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Report a failed staging push
        if: (failure() || cancelled()) && github.event_name == 'push'
        run: 'echo "::error title=staging is red::The merged result of staging fails: lint, python and package. Open the failed step above for the test."'
