# pr-rules.yml: the title, the changelog line and the release markers. It runs when the title, the body or the labels change, which the suites in checks.yml do not.
# Every run checks again: a skipped or no-op run would replace an earlier failure on the same commit with a success.
name: pr-rules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-rules:
    name: pr-rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-pr.sh diffs against the merge base with the base branch.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the title, the changelog line and the release markers
        env:
          BASE_REF: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          failed=0
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert)(\([a-z0-9-]+\))?: [^[:space:]]'
          if [[ $TITLE =~ $pattern ]]; then
            printf 'title ok: %s\n' "$TITLE"
          else
            printf 'title: %s\n' "$TITLE"
            echo "The title must read 'type(scope): summary'. Types: feat fix perf refactor docs test ci build chore revert."
            echo "The scope is optional and uses lowercase letters, digits and hyphens."
            failed=1
          fi
          bash Tools/hooks/check-pr.sh "origin/$BASE_REF" || failed=1
          exit "$failed"
