# pr-rules.yml: the changelog line and the release markers. It runs when the body or the labels change, which the suites in checks.yml do not.
name: pr-rules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-rules:
    name: pr-rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Decide whether the body or the base changed
        id: scope
        env:
          ACTION: ${{ github.event.action }}
          BODY_CHANGED: ${{ github.event.changes.body != null }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
        run: |
          if [ "$ACTION" = edited ] && [ "$BODY_CHANGED" = false ] && [ "$BASE_CHANGED" = false ]; then
            echo "pr-rules: skip: the title changed, not the body or the base; skipping with a success"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "pr-rules: run: $ACTION"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.run == 'true'
        with:
          # check-pr.sh diffs against the merge base with the base branch.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the changelog line and the release markers
        if: steps.scope.outputs.run == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash Tools/hooks/check-pr.sh "origin/$BASE_REF"
