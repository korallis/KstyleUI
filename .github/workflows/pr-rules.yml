# pr-rules.yml: the changelog line and the release markers. It runs when the body or the labels change, which the suites in checks.yml do not.
# Every run checks again: a skipped or no-op run would replace an earlier failure on the same commit with a success.
name: pr-rules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-rules:
    name: pr-rules
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, mac-ci, KstyleUI]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-pr.sh diffs against the merge base with the base branch.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the changelog line and the release markers
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash Tools/hooks/check-pr.sh "origin/$BASE_REF"
