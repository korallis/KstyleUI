# pr-title.yml: the pull request title must read "type(scope): summary" (Conventional Commits).
# A body or base edit leaves the title alone, so it ends with a success without checking.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          ACTION: ${{ github.event.action }}
          TITLE_CHANGED: ${{ github.event.changes.title != null }}
        run: |
          if [ "$ACTION" = edited ] && [ "$TITLE_CHANGED" = false ]; then
            echo "title: skip: the edit did not change the title; skipping with a success"
            exit 0
          fi
          pattern='^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert)(\([a-z0-9-]+\))?: [^[:space:]]'
          if [[ $TITLE =~ $pattern ]]; then
            printf 'title ok: %s\n' "$TITLE"
          else
            printf 'title: %s\n' "$TITLE"
            echo "The title must read 'type(scope): summary'. Types: feat fix perf refactor docs test ci build chore revert."
            echo "The scope is optional and uses lowercase letters, digits and hyphens."
            exit 1
          fi
