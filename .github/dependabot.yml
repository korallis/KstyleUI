# dependabot.yml: weekly pull requests that move the pinned GitHub Actions to their latest release.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    # Wait a week after a release, so a compromised release has time to be caught.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "no changelog"
